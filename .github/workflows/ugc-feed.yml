name: Refresh Mine UGC feed

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mine-ugc-feed-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh from the official Instagram Graph API
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: node scripts/fetch-ugc-feed.mjs
      - name: Validate the complete replacement feed
        run: node -e "const f=require('./ugc-feed.json'); if (!Array.isArray(f.items) || !f.items.every(x=>x.id&&x.permalink&&x.thumbnail&&typeof x.isUGC==='boolean')) throw new Error('invalid feed'); console.log('validated',f.items.length,'posts')"
      - name: Commit the successful snapshot
        run: |
          git add ugc-feed.json
          if git diff --cached --quiet; then
            echo "The verified feed is already current."
            exit 0
          fi
          git config user.name "ugc-mine feed bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh Mine UGC feed"
          git push
